name: Publish to PyPI

# 两段式发布：
#   阶段一  push tag v*         → 构建 + 试发布到 TestPyPI，验证无误后再进阶段二
#   阶段二  GitHub Release 发布 → 同一 tag 重新构建 + 正式发布到 pypi.org
# 两阶段共用本文件：两平台 Trusted Publisher 注册均为
# workflow 文件名 = pypi-publish.yml / environment = pypi（OIDC，不用 API token）。
# 人工门禁 = 阶段二的 Release 发布按钮；因此不要在 GitHub 的 pypi 环境
# 上加 Required reviewers，否则阶段一也会被卡。

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# S16: prevent tag-push and release-fire from publishing concurrently.
concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-testpypi:
    name: build & publish → test.pypi.org
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Guard — tag 与 pyproject 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v$TAG 与 pyproject.toml 版本 $FILE 不一致"
            exit 1
          fi

      - name: Guard — server.json 与 pyproject 版本一致
        run: |
          python - <<'PY'
          import json, pathlib, sys, tomllib
          v = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]["version"]
          s = json.loads(pathlib.Path("server.json").read_text("utf-8"))
          bad = []
          if s.get("version") != v:
              bad.append(f"version={s.get('version')}")
          pkgs = s.get("packages") or []
          if pkgs and pkgs[0].get("version") != v:
              bad.append(f"packages[0].version={pkgs[0].get('version')}")
          if bad:
              print(f"::error::server.json 版本 {', '.join(bad)} 与 pyproject.toml 的 {v} 不一致")
              sys.exit(1)
          PY

      - name: Build sdist & wheel
        run: |
          pip install "build>=1.2"
          python -m build

      - name: Record artifact digests (A12 — auditable against PyPI post-upload)
        run: |
          cd dist
          # 清单写到 dist/ 之外：pypa/gh-action-pypi-publish 按 dist/* 收件，
          # 留在 dist/ 内会被 twine 判为非法分发包而中止发布。
          sha256sum *.tar.gz *.whl | tee ../SHA256SUMS.txt
          sha256sum -c ../SHA256SUMS.txt

      - name: Upload digest manifest as release record
        uses: actions/upload-artifact@v4
        with:
          name: dist-sha256sums-${{ github.run_id }}-${{ github.job }}
          path: SHA256SUMS.txt

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 缺省时该 action 上传到正式 PyPI；TestPyPI 必须显式指定。
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: build & publish → pypi.org
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Guard — tag 与 pyproject 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v$TAG 与 pyproject.toml 版本 $FILE 不一致"
            exit 1
          fi

      - name: Guard — server.json 与 pyproject 版本一致
        run: |
          python - <<'PY'
          import json, pathlib, sys, tomllib
          v = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]["version"]
          s = json.loads(pathlib.Path("server.json").read_text("utf-8"))
          bad = []
          if s.get("version") != v:
              bad.append(f"version={s.get('version')}")
          pkgs = s.get("packages") or []
          if pkgs and pkgs[0].get("version") != v:
              bad.append(f"packages[0].version={pkgs[0].get('version')}")
          if bad:
              print(f"::error::server.json 版本 {', '.join(bad)} 与 pyproject.toml 的 {v} 不一致")
              sys.exit(1)
          PY

      - name: Build sdist & wheel
        run: |
          pip install "build>=1.2"
          python -m build

      - name: Record artifact digests (A12 — auditable against PyPI post-upload)
        run: |
          cd dist
          # 清单写到 dist/ 之外：pypa/gh-action-pypi-publish 按 dist/* 收件，
          # 留在 dist/ 内会被 twine 判为非法分发包而中止发布。
          sha256sum *.tar.gz *.whl | tee ../SHA256SUMS.txt
          sha256sum -c ../SHA256SUMS.txt

      - name: Upload digest manifest as release record
        uses: actions/upload-artifact@v4
        with:
          name: dist-sha256sums-${{ github.run_id }}-${{ github.job }}
          path: SHA256SUMS.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 语法/JSON 预检，单独成 job 而不是塞进 lint：文件一旦解析不了，ruff 对该
  # 文件只报 invalid-syntax，里面的其它违规全部隐身；生成物的 JSON 损坏则
  # 会在无关测试模块的收集期炸出 JSONDecodeError。两者都是毫秒级可判定，
  # 放在最前面、与 lint/format 并行，谁也遮蔽不了谁。
  precheck:
    name: precheck (syntax + JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # stdlib only —— 不装任何依赖，秒级返回。
      - name: Parse every tracked .py / .json
        run: python scripts/check_syntax.py

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # S16 (review v2): pin the version — ruff format output is
      # version-sensitive, an unpinned `latest` can red CI on style drift
      # that no code change caused.
      - name: Install ruff (pinned)
        run: pip install "ruff==0.16.6"

      # 全库零豁免执法（规则见 pyproject [tool.ruff]，ignore 仅 E501），
      # 防止 2026-09 清债前"声明了规则但从不执行"的存量债再次累积。
      - name: ruff check
        run: ruff check .

  # 与 `ruff check` 拆成两个 job：合在一个 job 里时 check 失败会让 format
  # 步骤直接 skip，格式漂移在下次 CI 之前完全看不到（本仓库真实发生过：
  # check 报了 4 条、format 从未跑过，而实际有 2 个文件未格式化）。
  format:
    name: ruff format --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install ruff (pinned)
        run: pip install "ruff==0.16.6"

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.14 为开发/测试基准版本；3.13 为支持下限（PEP 758 语法
        # 已于 0.1.5 替换为括号形式，见 CHANGELOG）。
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Sanity — entry point importable
        run: python -c "import ppsspp_dfx_mcp; print('import ok')"

      # 集成测试中需要真实 PPSSPP / ISO 的用例按设计自动 skip；
      # 其余（单元 + 契约 + fixture 化集成）必须三平台全绿。
      - name: Run test suite
        run: python -m pytest tests -q

      # C4 守卫（review v2）：skip 必须是显式声明的豁免（真实 PPSSPP/ISO
      # 资源、平台门控、未录制夹具）。禁止"路径解析失败导致整模块静默
      # skip"——旧版 parents[5] 曾使两个契约模块在 CI 上零执行仍全绿。
      - name: Skip audit (documented skips only)
        run: python scripts/check_skips.py

      # 🔴-4 守卫：门禁引擎的纯逻辑单测纳入 CI（此前游离于门禁外）
      # W19 (review v3): 从"显式两个文件"改为整个 evals/ 目录——显式清单
      # 漏掉了 evals/test_bridge.py（bridge 的 token/CORS/体积门禁），新增
      # 测试文件也不会自动进 CI。当前 evals/ 下全部测试均为纯逻辑：fake 模式
      # （BridgeCore(real=False)）、无 API key、无真机 PPSSPP/ISO、无外部网络，
      # 因此无需 --ignore。
      - name: evals (all pure-logic tests)
        run: python -m pytest evals -q

  # 唯一门禁信号：分支保护/规则集只要求它，所以新增 job 时必须同步加到这里
  # （否则新 job 红了也不挡合入）。
  ci-ok:
    name: ci-ok
    needs: [precheck, lint, format, test]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify all jobs passed
        run: |
          failed=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 did not succeed: $2"
              failed=1
            fi
          }
          check precheck "${{ needs.precheck.result }}"
          check lint "${{ needs.lint.result }}"
          check format "${{ needs.format.result }}"
          check test "${{ needs.test.result }}"
          if [ "$failed" != "0" ]; then
            exit 1
          fi
          echo "all jobs passed"

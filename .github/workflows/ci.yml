name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      # 全库零豁免执法（规则见 pyproject [tool.ruff]，ignore 仅 E501），
      # 防止 2026-09 清债前"声明了规则但从不执行"的存量债再次累积。
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.14 为开发/测试基准版本；3.13 为支持下限（PEP 758 语法
        # 已于 0.1.5 替换为括号形式，见 CHANGELOG）。
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Sanity — entry point importable
        run: python -c "import ppsspp_dfx_mcp; print('import ok')"

      # 集成测试中需要真实 PPSSPP / ISO 的用例按设计自动 skip；
      # 其余（单元 + 契约 + fixture 化集成）必须三平台全绿。
      - name: Run test suite
        run: python -m pytest tests -q

      # 🔴-4 守卫：门禁引擎的纯逻辑单测纳入 CI（此前游离于门禁外）
      - name: evals gate engine (pure unit, no API)
        run: python -m pytest evals/test_gates.py evals/test_b2_skill.py -q

  ci-ok:
    name: ci-ok
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix did not fully succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all jobs passed"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # S16 (review v2): pin the version — ruff format output is
      # version-sensitive, an unpinned `latest` can red CI on style drift
      # that no code change caused.
      # W7 (review v4): the pin must equal the version uv.lock resolves,
      # otherwise the local gate and the CI gate enforce different rules.
      # 0.16.6 -> 0.16.8 realigns pyproject (x2), this workflow and uv.lock.
      - name: Install ruff (pinned)
        run: pip install "ruff==0.16.8"

      # 全库零豁免执法（规则见 pyproject [tool.ruff]，ignore 仅 E501），
      # 防止 2026-09 清债前"声明了规则但从不执行"的存量债再次累积。
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # A19: 工具函数体 > 120 行的 @mcp.tool 函数必须在 docstring 写明
      # `LONG-TOOL:` 理由（冻结存量豁免，只允许缩短）。纯 AST 扫描，无依赖。
      - name: tool-function length gate (A19)
        run: python scripts/check_tool_function_length.py

  # W7 (review v4): pyproject ↔ uv.lock 一致性守门。
  #
  # 本项目是应用（发布到 PyPI / MCP registry 的 MCP server），uv.lock 已纳入
  # 版本控制（见 .gitignore），因此 CI checkout 里有可对比的基线锁。本 job 只跑
  # `uv lock --check`：pyproject 与锁不一致（改了依赖却忘跑 `uv lock`）即 exit 1，
  # 把漂移变成结构上不可能，而非依赖开发者自觉。
  lockfile:
    name: uv lock (pyproject ↔ lock consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Verify the committed lock matches pyproject
        run: uv lock --check

  # A10: mypy 硬门禁（P1-7 收口，2026-10-03）。存量类型错误已清零
  # （269 → 0，134 个源文件，"Success: no issues found"），故移除
  # continue-on-error —— 类型回归自此与 ruff/pytest 同级阻断合并。
  # 配置见 pyproject [tool.mypy]（files=["src"]）。
  mypy:
    name: mypy (src)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # dev extras 已包含 mypy（pyproject [project.optional-dependencies].dev）。
      - name: Install (editable, with dev extras)
        run: pip install -e .[dev]

      - name: mypy src
        run: mypy src

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.14 为开发/测试基准版本；3.13 为支持下限（PEP 758 语法
        # 已于 0.1.5 替换为括号形式，见 CHANGELOG）。
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Sanity — entry point importable
        run: python -c "import ppsspp_dfx_mcp; print('import ok')"

      # 集成测试中需要真实 PPSSPP / ISO 的用例按设计自动 skip；
      # 其余（单元 + 契约 + fixture 化集成）必须三平台全绿。
      - name: Run test suite
        run: python -m pytest tests -q

      # C4 守卫（review v2）：skip 必须是显式声明的豁免（真实 PPSSPP/ISO
      # 资源、平台门控、未录制夹具）。禁止"路径解析失败导致整模块静默
      # skip"——旧版 parents[5] 曾使两个契约模块在 CI 上零执行仍全绿。
      - name: Skip audit (documented skips only)
        run: python scripts/check_skips.py

      # 🔴-4 守卫：门禁引擎的纯逻辑单测纳入 CI（此前游离于门禁外）
      # W19 (review v3): 从"显式两个文件"改为整个 evals/ 目录——显式清单
      # 漏掉了 evals/test_bridge.py（bridge 的 token/CORS/体积门禁），新增
      # 测试文件也不会自动进 CI。当前 evals/ 下全部测试均为纯逻辑：fake 模式
      # （BridgeCore(real=False)）、无 API key、无真机 PPSSPP/ISO、无外部网络，
      # 因此无需 --ignore。
      - name: evals (all pure-logic tests)
        run: python -m pytest evals -q

  ci-ok:
    name: ci-ok
    needs: [lint, test, lockfile, mypy]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.lockfile.result }}" != "success" ]; then
            echo "lockfile did not succeed: ${{ needs.lockfile.result }}"
            exit 1
          fi
          if [ "${{ needs.mypy.result }}" != "success" ]; then
            echo "mypy did not succeed: ${{ needs.mypy.result }}"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix did not fully succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all jobs passed"

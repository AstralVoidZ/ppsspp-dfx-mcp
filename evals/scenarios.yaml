# ppsspp-dfx blind-eval scenario cards v2 (v1.2, 2026-09-13).
# v1.2 gate change: L2-03/L2-04 first_tool whitelists ppsspp_session_list —
# "confirm the session first" is a rational strategy when the prompt names
# a specific session / commands a sequence (W1-W3 delta report conclusion).
# Ground truths are fixture-driven (from_fixture) — never hardcoded.
# Fixtures: tests/cassettes/fixtures (v1.20.4-605-gf0c28c6744)
version: 2
fixtures_dir: "../tests/cassettes/fixtures"

scenarios:
  # ── CTL ──────────────────────────────────────────────────────────
  - id: CTL-01
    tier: CTL
    capabilities: [control]
    pre_state: {sessions: 1}
    prompt: |
      告诉我 CPU 当前的 PC 值（十六进制）。
    max_turns: 12
    expected_first_tools: [ppsspp_query, ppsspp_frame_snapshot, ppsspp_health, ppsspp_session]
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok
      - type: answer_contains
        mode: any
        values:
          - from_fixture:
              file: cpu.getReg.json
              path: records.0.response.uintValue
              transform: hex

  - id: CTL-02
    tier: CTL
    capabilities: [control]
    pre_state: {sessions: 1}
    prompt: |
      帮我写一首关于秋天的短诗。
    max_turns: 12
    optimal_calls: 0
    gates:
      - type: no_tool

  # ── L1（单工具选择/参数）──────────────────────────────────────────
  - id: L1-01
    tier: L1
    capabilities: [selection, param]
    pre_state: {sessions: 1}
    prompt: |
      帮我看一下 0x08804000 开始的 16 个字节是什么内容。
    max_turns: 12
    expected_first_tools: [ppsspp_read_memory]
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_read_memory, param: action, expect: {exact: read_bytes}}
      - {tool: ppsspp_read_memory, param: size, expect: {exact: 16}}
      - {tool: ppsspp_read_memory, param: session_id, expect: omitted}
    gates:
      - type: first_tool
      - type: params
      - type: answer_contains
        mode: any
        values:
          - from_fixture: {file: memory.read.json, path: records.0.response.base64, transform: base64_hex, prefix_bytes: 4}
          - from_fixture: {file: memory.read.json, path: records.0.response.base64}

  - id: L1-02
    tier: L1
    capabilities: [selection]
    pre_state: {sessions: 1}
    prompt: |
      CPU 现在执行到哪了？告诉我 PC 的值（十六进制）。
    max_turns: 12
    expected_first_tools: [ppsspp_query, ppsspp_frame_snapshot]
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok
      - type: answer_contains
        mode: any
        values:
          - from_fixture:
              file: cpu.getReg.json
              path: records.0.response.uintValue
              transform: hex

  - id: L1-03
    tier: L1
    capabilities: [selection, param]
    pre_state: {sessions: 1}
    prompt: |
      帮我读一下 0x08804000 处的一个无符号 32 位值（十六进制）。
    max_turns: 12
    expected_first_tools: [ppsspp_read_memory]
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_read_memory, param: action, expect: {exact: read_u32}}
      - {tool: ppsspp_read_memory, param: address, expect: {exact: "0x08804000"}}
      - {tool: ppsspp_read_memory, param: session_id, expect: omitted}
    gates:
      - type: first_tool
      - type: params
      - type: answer_contains
        values:
          - from_fixture: {file: memory.read_u32.json, path: records.0.response.value, transform: hex}

  - id: L1-04
    tier: L1
    capabilities: [selection, param]
    pre_state: {sessions: 1}
    prompt: |
      帮我看 0x08804000 开始的 8 条汇编指令。
    max_turns: 12
    expected_first_tools: [ppsspp_disassemble]
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_disassemble, param: address, expect: {exact: "0x08804000"}}
      - {tool: ppsspp_disassemble, param: count, expect: {exact: 8}}
    gates:
      - type: first_tool
      - type: params
      - type: answer_contains
        mode: any
        values:
          - from_fixture: {file: memory.disasm.json, path: records.0.response.lines.0.name}
          - from_fixture: {file: memory.disasm.json, path: records.0.response.lines.0.symbol}

  - id: L1-05
    tier: L1
    capabilities: [selection]
    pre_state: {sessions: 1}
    prompt: |
      把 CPU 当前所有寄存器的值列给我。
    max_turns: 12
    expected_first_tools: [ppsspp_query, ppsspp_frame_snapshot]
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_query, param: action, expect: {exact: registers}}
    gates:
      - type: first_tool
      - type: params

  - id: L1-06
    tier: L1
    capabilities: [selection]
    pre_state: {sessions: 0}
    prompt: |
      我想先确认一下 MCP 服务器进程本身是否正常——注意我还没有启动任何游戏会话。
    max_turns: 12
    expected_first_tools: [ppsspp_health]
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: answer_contains
        values:
          - "ok"

  - id: L1-07
    tier: L1
    capabilities: [selection, param]
    pre_state: {sessions: 1}
    prompt: |
      这个游戏加载了哪些模块？
    max_turns: 12
    expected_first_tools: [ppsspp_query]
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_query, param: action, expect: {exact: modules}}
    gates:
      - type: first_tool
      - type: params
      - type: answer_contains
        values:
          - from_fixture: {file: hle.module.list.json, path: records.0.response.modules.0.name}

  - id: L1-08
    tier: L1
    capabilities: [selection, error_recovery]
    pre_state: {sessions: 1}
    prompt: |
      请把 0x08804500 处的 4 个字节改写成 0x00000000。
    max_turns: 12
    expected_first_tools: [ppsspp_write_memory]
    optimal_calls: 2
    param_expectations:
      - {tool: ppsspp_write_memory, param: address, expect: {exact: "0x08804500"}}
    gates:
      - type: first_tool
      - type: params
      - type: recovery
        error_code: PROTECTED_ADDRESS
        then: {tool: ppsspp_write_memory, with_params: {force: true}}
        max_gap: 4
      - type: final_call_ok

  # ── L2（多步工作流）──────────────────────────────────────────────
  - id: L2-01
    tier: L2
    capabilities: [composite]
    pre_state: {sessions: 0}
    prompt: |
      帮我把模拟器跑起来，加载 D:\games\game.iso；等 CPU 就绪后，
      告诉我当前 PC（十六进制）和游戏标题。
    max_turns: 12
    expected_first_tools: [ppsspp_session]
    optimal_calls: 3
    gates:
      - type: first_tool
      - type: boot_order
      - type: recovery
        error_code: CPU_NOT_STARTED
        then: {tool: ppsspp_session, with_params: {action: wait_ready}}
        max_gap: 4
      - type: answer_contains
        values:
          - from_fixture: {file: game.status.json, path: records.0.response.game.title}
          - from_fixture: {file: cpu.status.json, path: records.0.response.pc, transform: hex}

  - id: L2-02
    tier: L2
    capabilities: [composite, selection]
    pre_state: {sessions: 1}
    prompt: |
      帮我找出是谁在读取 0x08A0D000 这个地址，把触发点的 PC 值告诉我。
    max_turns: 12
    expected_first_tools: [ppsspp_breakpoint]
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_breakpoint, param: address, expect: {exact: "0x08A0D000"}}
      - {tool: ppsspp_breakpoint, param: access, expect: {exact: read}}
    gates:
      - type: first_tool
      - type: params

  - id: L2-03
    tier: L2
    capabilities: [selection, efficiency]
    pre_state: {sessions: 1}
    prompt: |
      帮我做一段自动化操作：按一下 start 键，等 60 帧，然后截一张图。
      要求尽量用一条命令完成整个序列。
    max_turns: 12
    expected_first_tools: [ppsspp_batch_step, ppsspp_session]  # v1.2: 会话确认合理（v0.1.6 起 list 并入 session）
    optimal_calls: 1
    param_expectations:
      - {tool: ppsspp_batch_step, param: steps, expect: {len: 3}}
    gates:
      - type: first_tool
      - type: params

  - id: L2-04
    tier: L2
    capabilities: [error_recovery]
    pre_state: {sessions: 2}
    prompt: |
      从模拟器会话里读取 0x08804000 处的 16 个字节（用先启动的那个会话）。
    max_turns: 12
    expected_first_tools: [ppsspp_read_memory, ppsspp_session]  # v1.2: 指定会话→先列合理（v0.1.6 起 list 并入 session）
    optimal_calls: 3
    gates:
      - type: first_tool
      - type: recovery
        error_code: SESSION_AMBIGUOUS
        then: {tool: ppsspp_read_memory, with_params: {session_id: "*any*"}}
        max_gap: 4
      - type: answer_contains
        values:
          - from_fixture: {file: memory.read.json, path: records.0.response.base64, transform: base64_hex, prefix_bytes: 4}

  - id: L2-05
    tier: L2
    capabilities: [error_recovery]
    pre_state: {sessions: 1}
    prompt: |
      帮我在前台跑一段自动化序列：等 1800 帧，然后告诉我执行结果。
    max_turns: 12
    optimal_calls: 3
    gates:
      - type: tool_used
        name: ppsspp_batch_step
      - type: recovery
        error_code: BATCH_BUDGET_EXCEEDED
        then: {tool: ppsspp_batch_step, with_params: {background: true}}
        max_gap: 3
      - type: tool_used
        name: ppsspp_batch_status

  - id: L2-06
    tier: L2
    capabilities: [composite]
    pre_state: {sessions: 1}
    prompt: |
      0x08804000 处存着一条 MIPS 指令。请你先读出这个地址的 4 字节指令编码
      （十六进制），然后再反汇编 0x08804000 开始的 1 条指令，告诉我这条指令是什么。
    max_turns: 12
    optimal_calls: 2
    gates:
      - type: sequence
        expected_sequence: [ppsspp_read_memory, ppsspp_disassemble]
      - type: answer_contains
        values:
          - from_fixture: {file: memory.read_u32.json, path: records.0.response.value, transform: hex}
          - from_fixture: {file: memory.disasm.json, path: records.0.response.lines.0.name}

  # ── L3（领域概念/边缘，judge 补充评估待派发）─────────────────────
  - id: L3-01
    tier: L3
    capabilities: [concept]
    pre_state: {sessions: 1}
    prompt: |
      我在 0x08A0D000 设了个内存断点，但一直不触发。帮我诊断可能的原因，
      并给出修复办法。
    max_turns: 20
    optimal_calls: 2
    judge_pending: true
    gates:
      - type: answer_contains
        mode: any
        values: ["CPUCore", "IR"]

  - id: L3-02
    tier: L3
    capabilities: [concept]
    pre_state: {sessions: 1}
    prompt: |
      我调用 ppsspp_screenshot 时返回了 empty=true，没有图像。
      我想要一张真实的游戏画面截图，应该怎么做？
    max_turns: 20
    optimal_calls: 3
    judge_pending: true
    gates:
      - type: answer_contains
        mode: any
        values: ["empty", "无渲染", "空帧", "空白"]
      - type: answer_contains
        mode: any
        values: ["wait_frames", "press", "batch", "推进", "进入画面", "等画面"]

  - id: L3-03
    tier: L3
    capabilities: [concept]
    pre_state: {sessions: 1}
    prompt: |
      帮我确认 0x00010000 和 0x08804000 分别属于哪块内存区域，用工具查证后告诉我。
    max_turns: 20
    expected_first_tools: [ppsspp_memory_map, ppsspp_query, ppsspp_session]
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: answer_contains
        values:
          - from_fixture: {file: memory.mapping.json, path: records.0.response.ranges.0.name}

  # ── REAL（真实 PPSSPP，结构门禁——真机值动态，不能固定断言）────────
  # mode: real → runner 不注入 fake env，预置会话用真实 ISO
  # （PPSSPP_DFX_TEST_ISO_PATH 指定），
  # run 结束后停会话防 PPSSPP 孤儿进程。n=3/n=2 小样本（效度验证用途）。
  - id: R1-REAL-BOOT
    tier: REAL
    capabilities: [composite]
    mode: real
    pre_state: {sessions: 0}
    prompt: |
      帮我把模拟器跑起来，加载 {{REAL_ISO}}；
      等 CPU 就绪后，告诉我当前 PC（十六进制）和游戏标题。
    max_turns: 12
    expected_first_tools: [ppsspp_session]
    optimal_calls: 3
    gates:
      - type: first_tool
      - type: boot_order
      - type: answer_contains
        mode: any   # ISS-009: literal 'Game' failed non-English answers of a
        values:     # correctly-executed boot — accept any game-identity token
          - "{{PPSSPP_DFX_EVAL_GAME_PRODUCT_CODE}}"
          - "{{PPSSPP_DFX_EVAL_GAME_CODE}}"
          - "{{PPSSPP_DFX_EVAL_GAME_TITLE}}"
          - "{{PPSSPP_DFX_EVAL_GAME_TITLE_JP}}"
          - "幻域传"
      - type: final_call_ok

  - id: R2-REAL-SHOT
    tier: REAL
    capabilities: [composite]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      我想要一张当前游戏画面的真实截图。请用工具拿到它，并告诉我截图文件的
      保存路径和文件大小。
    max_turns: 15
    optimal_calls: 3
    gates:
      - type: file_saved
        tool: ppsspp_screenshot
      - type: final_call_ok
  # ── REAL 扩充第一批（B-3，2026-09-20）：覆盖核心工具类别 ──────────
  - id: R3-REAL-GETPC
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      查询当前 CPU 的 PC 值（十六进制）并告诉我。
    max_turns: 8
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R4-REAL-REGS
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      读取当前 CPU 所有通用寄存器的值，汇总给我。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R5-REAL-MEMAP
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      获取当前游戏的内存映射（各模块加载区间），告诉我有几个区段。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R6-REAL-MEMREAD
    tier: REAL
    capabilities: [selection, param]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      读取 0x08804000 开始的 32 个字节，以十六进制 dump 格式给我。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R7-REAL-DISASM
    tier: REAL
    capabilities: [selection, param]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      反汇编当前 PC 处往后的 8 条指令，逐条列出。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R8-REAL-BPSET
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      在当前 PC 地址设一个执行断点，确认设好后告诉我断点地址。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R9-REAL-STEP
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      暂停 CPU 后单步执行 3 条指令，告诉我每步后的 PC 值。
    max_turns: 12
    optimal_calls: 3
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R10-REAL-SCAN
    tier: REAL
    capabilities: [selection, param]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      在内存中扫描字节模式 "50 53 50"（PSP 魔数），告诉我找到几个匹配。
    max_turns: 12
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R11-REAL-SCRIPT
    tier: REAL
    capabilities: [composite]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      列出可用的调试脚本，挑一个只读的诊断脚本运行，把输出给我。
    max_turns: 12
    optimal_calls: 2
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R12-REAL-HEALTH
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      做一次会话健康检查，告诉我模拟器版本和会话状态。
    max_turns: 8
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok
  # ── REAL 扩充第二批（B-3，2026-09-20）：断点追踪/观察/图形/输入/脚本 ──
  - id: R13-REAL-BPWAIT
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      在 0x08804000 设一个执行断点，等待命中（超时 5 秒即可），告诉我是否命中。
    max_turns: 12
    optimal_calls: 2
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R14-REAL-BPSTATS
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      查询断点统计信息（最近 30 秒窗口内的命中情况），汇总给我。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R15-REAL-BPTRACE
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      对 0x08804000 做一次内存读取访问追踪（超时 5 秒），告诉我追踪结果。
    max_turns: 12
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R16-REAL-WATCH
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      观察 0x08804000 处的 u32 值变化，持续 2 帧，把每次变化记录给我。
    max_turns: 12
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R17-REAL-STATEOBS
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      做一次状态观察，告诉我当前 CPU 是否暂停、PC 值和调用栈摘要。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R18-REAL-FRAME
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      抓取当前帧快照，告诉我帧号和画面摘要信息。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R19-REAL-DUMP
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      尝试 dump 当前绑定的 GPU 纹理（level 0），告诉我结果（成功给路径，失败给原因）。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R20-REAL-GPUSTATS
    tier: REAL
    capabilities: [selection]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      查询 GPU 统计信息，告诉我当前帧率和绘制调用数。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R21-REAL-PRESS
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      按一次 PSP 的 Circle 按钮（持续 5 帧），告诉我操作完成。
    max_turns: 10
    optimal_calls: 1
    gates:
      - type: first_tool
      - type: final_call_ok

  - id: R22-REAL-HOLD
    tier: REAL
    capabilities: [control]
    mode: real
    pre_state: {sessions: 1}
    prompt: |
      持续按住 Cross 按钮，直到我后续说停（先按 10 帧然后停），告诉我执行了。
    max_turns: 12
    optimal_calls: 2
    gates:
      - type: first_tool

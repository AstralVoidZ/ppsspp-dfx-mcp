[project]
name = "ppsspp-dfx-mcp"
version = "0.1.6"
description = "PPSSPP debug MCP server — engineering-grade debugging SDK for PSP game localization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ppsspp-dfx-mcp contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ppsspp",
    "psp",
    "debug",
    "localization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.1.1,<3",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "websockets>=12.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff",
]

# uv 默认安装 dependency-groups（uv sync / uv run），pytest 在此声明，
# 避免 `uv run pytest` 静默回落到系统 PATH 上环境不匹配的 pytest。
# extra `[dev]`（上方）仍保留，供 `pip install -e .[dev]`（CI）使用。
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ppsspp-dfx-mcp = "ppsspp_dfx_mcp.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppsspp_dfx_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = [
    "integration: marks tests as integration tests (require external resources)",
    "real_ppsspp: marks tests that require a real PPSSPP process (skipped when PPSSPP/ISO unavailable)",
]
